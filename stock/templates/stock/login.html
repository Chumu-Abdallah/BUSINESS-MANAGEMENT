{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Business Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'stock/css/style.css' %}?v=5">
    <style>
        /* LOGIN PEKEE - HAINA SCROLL */
        html, body{
            overflow: hidden !important;
            height: 100vh !important;
            height: 100dvh !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        .login-full{
            height: 100vh;
            height: 100dvh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-box{
            width: 100%;
            max-width: 400px;
            background: rgba(255,255,255,0.184);
            border: 1px solid rgba(255,255,255,0.232);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-align: center;
        }
        .login-box input{
            width: 90% !important;
            max-width: 300px;
            margin: 8px auto !important;
            display: block !important;
            text-align: center;
            background: rgba(255,255,255,0.1) !important;
            border: 1px solid rgba(255,255,255,0.3) !important;
            color: white !important;
            padding: 12px !important;
            border-radius: 12px;
            font-size: 16px;
        }
        .login-box input::placeholder{ color: rgba(255,255,255,0.7); }
        .login-box button{
            width: 90% !important;
            max-width: 300px;
            margin: 15px auto 0 auto !important;
            display: block !important;
            padding: 12px !important;
            border-radius: 12px;
            font-weight: bold;
            background: linear-gradient(90deg, #7c3aed, #22daee);
            border: none;
            color: white;
        }
    </style>
</head>
<body>

<div class="login-full">
    <div class="login-box">
        <h4 class="text-center fw-bold mb-2" style="color:white;">BUSINESS MANAGEMENT</h4>
        <p class="text-center mb-4" style="color:rgba(255,255,255,0.7); font-size:13px;">MFUMO WA KUDHIBITI BIASHARA</p>
        
        {% if error %}
        <div class="alert alert-danger py-2" style="font-size:13px;">{{error}}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input name="username" class="form-control" placeholder="Username" required>
            <input name="password" type="password" class="form-control" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</div>

</body>
</html>
