{% extends 'stock/base.html' %}
{% load static %}
{% block content %}
<div class="container d-flex justify-content-center" style="overflow:visible;">
<div class="card col-md-5 mx-auto p-4 shadow mt-4" style="width:100%; overflow:visible;">
    <h4 class="text-center mb-3">🔒 Badili Password</h4>

    {% if error %}
    <div class="alert alert-danger text-center d-flex align-items-center justify-content-center">
        <span style="background: white; color: #dc3545; width:22px; height:22px; border-radius: 50%; display:flex; align-items: center; justify-content: center; margin-right: 10px;">&#10007;</span>
        {{error}}
    </div>
    {% endif %}

    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-success text-center d-flex align-items-center justify-content-center">
       <span style="background: white; color: #198754; width:22px; height:22px; border-radius: 50%; display:flex; align-items: center; justify-content: center; margin-right: 10px;">&#10003;</span>
         {{ message }}
    </div>
    {% endfor %}
    {% endif %}

    <div class="card p-3 shadow" style="width:100%;">
        <form method="POST" id="passwordForm" style="width:100%; display:flex; flex-direction:column; align-items:center;">
        {% csrf_token %}

        <input name="old_password" type="password" class="form-control mb-3" placeholder="Weka password ya zamani" required style="width:90%; max-width:350px; margin:0 auto;">

        <input type="password" id="new_password" name="new_password" class="form-control mb-2" placeholder="Weka Password Mpya" required onkeyup="checkStrength(); checkMatch()" style="width:90%; max-width:350px; margin:0 auto;">

        <input type="password" id="confirm_password" name="confirm_password" class="form-control mb-2" placeholder="Thibitisha Password Mpya" required onkeyup="checkMatch()" style="width:90%; max-width:350px; margin:0 auto;">
        
        <div class="progress mb-2" style="height:5px; width:90%; max-width:350px;">
            <div id="strengthBar" class="progress-bar" style="width:0%"></div>
        </div>
        <small id="strengthText" style="width:90%; text-align:center; display:block;"></small>
        <small id="matchText" style="width:90%; text-align:center; display:block; margin-top:5px;"></small>

        <div class="form-check mt-2 mb-3" style="width:90%; max-width:350px;">
            <input type="checkbox" class="form-check-input" id="showPass" onclick="showPassword()">
            <label class="form-check-label" for="showPass">Onesha Password</label>
        </div>

        <button id="o" class="btn btn-dark w-100" style="max-width:350px;">Badilisha Password</button>
        </form>
    </div>
</div>
</div>

<script>
function checkStrength(){
    let pass = document.getElementById('new_password').value;
    let bar = document.getElementById('strengthBar');
    let text = document.getElementById('strengthText');
    let strength = 0;
    if (pass.length >= 4) strength += 25;
    if (pass.length >= 8) strength += 25;
    if (/[A-Z]/.test(pass)) strength += 25;
    if (/[0-9]/.test(pass)) strength += 25;
    bar.style.width = strength + '%';
    if (strength < 50){
        bar.className = 'progress-bar bg-danger';
        text.innerText = 'Password dhaifu!';
        text.className = 'text-danger';
    }
    else if(strength < 75){
        bar.className = 'progress-bar bg-warning';
        text.innerText = 'Password wastani!';
        text.className = 'text-warning';
    }
    else{
        bar.className = 'progress-bar bg-success';
        text.innerText = 'Password imara sana!';
        text.className = 'text-success';
    }
}
function checkMatch(){
    let p1 = document.getElementById('new_password').value;
    let p2 = document.getElementById('confirm_password').value;
    let txt = document.getElementById('matchText');
    if (p2 == ''){txt.innerText = ''; return;}
    if (p1 == p2){
        txt.innerText = '✓ Password zimefanana';
        txt.className = 'text-success';
        txt.style.color = 'white';
    }
    else{
        txt.innerText = '✗ Password hazifanani';
        txt.className = 'text-danger';
        txt.style.color = 'red';
    }
}
function showPassword(){
    let np = document.getElementById('new_password');
    let cp = document.getElementById('confirm_password');
    let op = document.querySelector('input[name="old_password"]');
    let type = np.type == 'password' ? 'text' : 'password';
    np.type = type;
    cp.type = type;
    if(op) op.type = type;
}
</script>
{% endblock %}
