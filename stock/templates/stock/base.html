{% load static %}
<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <head>
        <title>stock-shop</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'stock/css/style.css' %}">
    </head>
    <body>
        <nav class="navbar navbar-dark bg-dark px-4">
            <a id="h" href="/" class="navbar-brabd fw-bold"><b>MFUMO  WA  KUDHIBITI  BIASHARA</b></a><br>
            <br>
            <div class="dropdown">
                <button class="btn btn-outline-light dropdown-toggle" data-bs-toggle="dropdown">
                    {{user.username}}
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdoun-item" href="/change_password/">🔒Badili Password</a></li>
                    {% if user.is_superuser %}
                    <li><a class="dropdown-item" href="/users/">👥 Watumiaji</a></li>
                    {% endif %}
                    <a href="/" class="dropdown-item">🏠 Home</a><br>
                    <li><a id="logout" class="dropdown-item text-danger" href="/logout/">📤 Logout</a></li>
                    <li><hr class="dropdown-divider"></li>
                    
                </ul>
            </div>
        </nav>
        <nav class="container mt-4">
            {% block content %}{% endblock %}
        </nav>
        <br>
        <script src="{% static 'stock/js/main.js' %}?v=2"></script>
        <script src="{% static 'stock/js/change_password.js'%}"></script>
        <br>
        <script src="https://cdn.jsdeliver.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</html>
